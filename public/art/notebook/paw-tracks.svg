<svg xmlns="http://www.w3.org/2000/svg" width="240" height="170" viewBox="0 0 240 170">
  <!-- muddy paw tracks walking across a page corner (bottom-left → top-right). Use with multiply, ~0.5 opacity. -->
  <defs>
    <g id="p"><path d="M0 4c-4.4 0-8 3.7-8 7.4 0 3 2.3 4.6 4.7 4.6 1.4 0 2.3-.8 3.3-.8s1.9.8 3.3.8c2.4 0 4.7-1.6 4.7-4.6C8 7.7 4.4 4 0 4z"/><ellipse cx="-9.2" cy="1.5" rx="2.8" ry="3.6"/><ellipse cx="-3.6" cy="-4" rx="2.8" ry="3.7"/><ellipse cx="3.6" cy="-4" rx="2.8" ry="3.7"/><ellipse cx="9.2" cy="1.5" rx="2.8" ry="3.6"/></g>
    <filter id="mud" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.25" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
  </defs>
  <g fill="#7a5233" fill-opacity="0.55" filter="url(#mud)">
    <use href="#p" transform="translate(28 150) rotate(52) scale(.95)"/>
    <use href="#p" transform="translate(70 142) rotate(58) scale(.95)" fill-opacity="0.5"/>
    <use href="#p" transform="translate(92 104) rotate(50) scale(.95)" fill-opacity="0.45"/>
    <use href="#p" transform="translate(134 98) rotate(56) scale(.95)" fill-opacity="0.38"/>
    <use href="#p" transform="translate(156 60) rotate(48) scale(.95)" fill-opacity="0.3"/>
    <use href="#p" transform="translate(198 54) rotate(55) scale(.95)" fill-opacity="0.24"/>
    <use href="#p" transform="translate(218 18) rotate(50) scale(.95)" fill-opacity="0.16"/>
  </g>
</svg>
