<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- subtle paper fibre/grain overlay (multiply over paper). Static: rasterised once by the browser. -->
  <filter id="g" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.36  0 0 0 0 0.26  0 0 0 -1.6 1.05"/>
  </filter>
  <rect width="240" height="240" filter="url(#g)" opacity="0.10"/>
</svg>
