<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- kraft-board cover texture: warm brown with fibres -->
  <filter id="f" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035 0.6" numOctaves="3" seed="3" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.30  0 0 0 0 0.19  0 0 0 0 0.10  0 0 0 0.55 0"/>
  </filter>
  <rect width="200" height="200" fill="#a8774f"/>
  <rect width="200" height="200" filter="url(#f)"/>
</svg>
