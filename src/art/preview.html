<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NO PEEKING! art preview</title>
<link rel="icon" href="/art/favicon.svg" />
<style>
  @font-face { font-family: Quicksand; src: url(/fonts/Quicksand.woff2) format('woff2'); font-weight: 300 700; }
  @font-face { font-family: Quantum; src: url(/fonts/Quantum.woff2) format('woff2'); }
  body { margin: 0; background: #f2f0eb; color: #0e0e0e; font-family: Quicksand, sans-serif; }
  header { display: flex; gap: 16px; align-items: center; padding: 10px 16px; position: sticky; top: 0; background: #f2f0ebee; z-index: 2; border-bottom: 2px solid #0e0e0e; flex-wrap: wrap; }
  header h1 { font-family: Quantum, sans-serif; font-size: 22px; margin: 0; }
  canvas { display: block; }
  #portraits { display: flex; flex-wrap: wrap; gap: 10px; padding: 12px 16px; align-items: center; }
  #portraits figure { margin: 0; text-align: center; font-size: 11px; }
  #portraits img { width: 72px; height: 72px; display: block; }
  #logo { padding: 12px 16px; display: flex; gap: 24px; align-items: center; }
</style>
</head>
<body>
<header>
  <h1>Art Preview</h1>
  <label>night <input id="night" type="range" min="0" max="1" step="0.01" value="0" /></label>
  <label><input id="pause" type="checkbox" /> pause</label>
  <button id="burst">burst all</button>
  <span id="fps"></span>
</header>
<div id="logo"><img src="/art/logo.svg" height="110" alt="logo" /><img src="/art/favicon.svg" height="48" alt="favicon" /></div>
<div id="portraits"></div>
<canvas id="c"></canvas>
<script type="module" src="./preview.ts"></script>
</body>
</html>
