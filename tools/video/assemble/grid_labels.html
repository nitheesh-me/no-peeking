<!doctype html>
<html><head><meta charset="utf-8">
<!-- Labels for the Editor's precomps (rendered by captions.mjs through safe-run --heavy, DPR 1, software GL).
     style "grid_labels": the 16 level chips of sc_grid16 on a transparent 3840x2160 frame (tile geometry in `text` as JSON)
     style "check":      one green check badge (tile-local, 160x160), overlaid per tile from its solve frame -->
<style>
@font-face { font-family: Quicksand; src: url(../../../public/fonts/Quicksand.woff2) format('woff2'); font-weight: 300 700; }
@font-face { font-family: Quantum; src: url(../../../public/fonts/Quantum.woff2) format('woff2'); }
:root { --paper: #f2f0eb; --ink: #0e0e0e; --go: #3ddc97; }
html, body { margin: 0; background: transparent; overflow: hidden; }
#stage { position: absolute; inset: 0; }
.chip { position: absolute; font-family: Quantum; color: var(--ink); background: var(--paper); border: 4px solid var(--ink);
  border-radius: 18px; padding: 6px 18px 4px; font-size: 44px; line-height: 1; box-shadow: 0 5px 0 var(--ink); }
.check { position: absolute; left: 8px; top: 8px; width: 136px; height: 136px; border-radius: 50%; background: var(--go);
  border: 6px solid var(--ink); box-shadow: 0 6px 0 var(--ink); display: flex; align-items: center; justify-content: center;
  font-family: Quicksand; font-weight: 700; font-size: 96px; color: var(--ink); line-height: 1; }
</style></head>
<body><div id="stage"></div>
<script>
window.renderCaption = async ({ text, style, mode }) => {
  const st = document.getElementById('stage');
  st.innerHTML = '';
  if (mode === 'mask') return {};
  if (style === 'check') {
    st.innerHTML = '<div class="check">✓</div>';
  } else {
    const g = JSON.parse(text);  // {tiles: [[label, x, y, w, h], ...]}
    for (const [lab, x, y] of g.tiles) {
      const d = document.createElement('div');
      d.className = 'chip'; d.textContent = lab;
      d.style.left = (x + 22) + 'px'; d.style.top = (y + 22) + 'px';
      st.appendChild(d);
    }
  }
  await document.fonts.ready;
  return {};
};
</script></body></html>
